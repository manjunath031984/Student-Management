services:
  jenkins:
    image: student-management-jenkins:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-management-jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    dns:
      - "8.8.8.8"
      - "8.8.4.4"
    environment:
      GODEBUG: tlsmlkem=0,tlskyber=0,http2client=0

volumes:
  jenkins_home:
