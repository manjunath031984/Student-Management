services:
  jenkins:
    image: student-management-jenkins:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-management-jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    # Jenkins uses the Docker Desktop daemon via /var/run/docker.sock.
    # Merge jenkins/docker-desktop-engine.json into Docker Desktop Engine JSON
    # (ipv6: false). Dockerd Go TLS to pkg.dev fails over IPv6 through
    # http.docker.internal:3128 with "tls: protocol version not supported".
    dns:
      - "8.8.8.8"
      - "8.8.4.4"
    environment:
      GODEBUG: tlsmlkem=0,tlskyber=0,http2client=0

volumes:
  jenkins_home:
