# and never commits the real value.
apiVersion: v1
kind: Secret
metadata:
  name: student-management-postgres-secret
  namespace: student-management
type: Opaque
stringData:
  POSTGRES_DB: student_management
  POSTGRES_USER: student_admin
  POSTGRES_PASSWORD: "INJECTED_BY_JENKINS"
