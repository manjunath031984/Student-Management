# Backend API base path from the repository: /api/students (Spring @RequestMapping("/api/students")).
# Frontend Axios uses /api when VITE_API_BASE_URL=/api is baked into the Docker image.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: student-management-route
  namespace: student-management
spec:
  parentRefs:
    - name: student-management-gateway
      namespace: student-management
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-service
          port: 80
