# Nginx configuration for Student Management React frontend
# Container listens on port 80; map host port 3000 → container 80
# Access from host: http://localhost:3000

server {
    listen 80;
    server_name localhost;

    # 1) Serve the React production build
    root /usr/share/nginx/html;
    index index.html;

    # Prefer UTF-8 for HTML responses
    charset utf-8;

    # Health / readiness style check for the default document
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 2) Listen on port 80 (above)
    # 3) Support React Router
    # 4) Return index.html for frontend routes (/add, /edit/:id, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static hashed assets from Vite
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Do not expose hidden files
    location ~ /\. {
        deny all;
    }
}
